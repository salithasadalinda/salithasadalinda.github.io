<!DOCTYPE html>
<html lang="en">
<head>

  <title>404 — Page Not Found | Salitha Sadalinda</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .error {
      min-height: 70vh;
      display: flex;

      justify-content: center;

      padding: 2rem 1rem;

      <h1>404</h1>
